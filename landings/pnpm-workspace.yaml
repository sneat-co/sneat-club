packages:
  - .

allowBuilds:
  # Browser bundle only — neither package's postinstall is needed to build the
  # landing, and the build is proven green with both ignored.
  '@firebase/util': false
  esbuild: true
  protobufjs: false
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
