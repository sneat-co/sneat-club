name: Deploy landing (Cloudflare)

# Deploys sneat.club (Astro landing + the /register flow) to Cloudflare Workers
# static assets via the shared reusable cf-deploy workflow (sneat-co/cicd), so
# this site deploys the same way as every other Sneat site and every deploy is
# visible in GitHub Actions.
#
# Until this existed the repo had no workflows at all: the site could only be
# deployed by hand from a laptop, which is how /register shipped to main and
# stayed a 404 in production.
#
# Auth is org-level: CLOUDFLARE_API_TOKEN org secret + CLOUDFLARE_ACCOUNT_ID org
# variable (an identifier, not a secret). No per-repo secrets needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - landings/**
      - .github/workflows/deploy-landings.yml

concurrency:
  group: deploy-landings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@main
    with:
      working-directory: landings
      # astro.config.mjs hardcodes site: "https://sneat.club", so no
      # PUBLIC_SITE_URL is threaded through here.
      build-command: pnpm build
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
